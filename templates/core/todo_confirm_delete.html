{% extends 'base.html' %}

{% block title %}Delete Task - Student Study Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 text-center">
            <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 64px; height: 64px;">
                <i class="bi bi-trash fs-2"></i>
            </div>
            
            <h4 class="fw-bold text-dark mb-2">Delete Task?</h4>
            <p class="text-muted mb-4">
                Are you sure you want to permanently delete the task: <br>
                <strong class="text-dark">"{{ task.title }}"</strong>? <br>
                <span class="small text-danger">This action cannot be undone.</span>
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'todo' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i> Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
